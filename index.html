<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kalù Backoffice</title>
<script src="config.js"></script>
<style>
:root {
  --bg: #f4f5f7; --card: #ffffff; --ink: #15181d; --muted: #5d6673; --line: #dfe3e8;
  --brand: #1f6f5c; --brand-ink: #ffffff; --brand-soft: #e3f1ec;
  --danger: #b3261e; --danger-soft: #fbe9e7; --ok: #1e7d32; --warn: #a15c00; --warn-soft: #fff3e0;
  --radius: 10px; --shadow: 0 1px 2px rgba(0,0,0,.06), 0 2px 8px rgba(0,0,0,.04);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111418; --card: #1a1e24; --ink: #e9ecf1; --muted: #9aa4b1; --line: #2c333c;
    --brand: #4fb393; --brand-ink: #0c1512; --brand-soft: #1b2e28;
    --danger: #ff8a80; --danger-soft: #3a1d1b; --ok: #81c784; --warn: #ffb74d; --warn-soft: #3a2a14;
    --shadow: none;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
a { color: var(--brand); }
button, input, select, textarea { font: inherit; color: inherit; }
input, select, textarea { width: 100%; padding: 9px 11px; border: 1px solid var(--line); border-radius: 8px;
  background: var(--card); }
textarea { min-height: 70px; resize: vertical; }
label { display: block; font-size: 13px; color: var(--muted); margin: 10px 0 4px; }
button { cursor: pointer; border: 1px solid var(--line); background: var(--card); padding: 8px 14px; border-radius: 8px; }
button.primary { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); font-weight: 600; }
button.danger { color: var(--danger); }
button.link { border: 0; background: none; color: var(--brand); padding: 4px 0; }
button:disabled { opacity: .5; cursor: default; }
header.top { display: flex; align-items: center; gap: 12px; padding: 10px 18px; background: var(--card);
  border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; }
header.top .logo { font-weight: 800; letter-spacing: .2px; }
header.top .spacer { flex: 1; }
header.top .who { color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 40vw; }
main { max-width: 1100px; margin: 0 auto; padding: 18px 16px 60px; }
/* menu a sinistra: categorie e sottocategorie, dettaglio al centro */
#shell { display: flex; align-items: flex-start; }
#shell main { flex: 1; min-width: 0; }
#nav { width: 270px; flex: none; position: sticky; top: 0; height: 100vh; overflow: auto; background: var(--card);
  border-right: 1px solid var(--line); padding: 12px 8px 40px; font-size: 14px; }
#nav .loc { margin: 0 6px 10px; }
#nav .loc label { font-size: 12px; color: var(--muted); }
#nav .loc select { width: 100%; }
#nav .v { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; border: 0; background: none; color: var(--ink);
  padding: 7px 10px; border-radius: 8px; cursor: pointer; font: inherit; }
#nav .v:hover { background: var(--brand-soft); }
#nav .v.on { background: var(--brand); color: var(--brand-ink); font-weight: 600; }
#nav .v.g { font-weight: 700; }
#nav .v .fr { margin-left: auto; color: var(--muted); font-size: 11px; }
#nav .v.on .fr { color: inherit; }
#nav .liv1 { padding-left: 14px; } #nav .liv2 { padding-left: 28px; }
#nav .v .n { margin-left: auto; background: var(--danger); color: #fff; border-radius: 10px; padding: 0 7px; font-size: 12px; font-weight: 700; }
#nav .dis { color: var(--muted); }
.percorso { color: var(--muted); font-size: 13px; margin-bottom: 4px; }
#menuBtn { display: none; }
@media (max-width: 860px) {
  #nav { position: fixed; z-index: 50; left: 0; top: 0; height: 100vh; box-shadow: 0 0 30px rgba(0,0,0,.25); }
  #nav.chiuso { display: none; }
  #menuBtn { display: inline-block; }
}
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow);
  padding: 16px; margin-bottom: 14px; }
.card h2 { margin: 0 0 10px; font-size: 17px; }
.card h3 { margin: 16px 0 8px; font-size: 15px; }
.narrow { max-width: 420px; margin: 40px auto; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; }
@media (max-width: 640px) { .grid2 { grid-template-columns: 1fr; } }
.list { list-style: none; margin: 0; padding: 0; }
.list li { display: flex; gap: 10px; align-items: center; padding: 11px 4px; border-bottom: 1px solid var(--line); }
.list li:last-child { border-bottom: 0; }
.list li.click { cursor: pointer; }
.list li.click:hover { background: var(--brand-soft); }
.grow { flex: 1; min-width: 0; }
.muted { color: var(--muted); font-size: 13px; }
.pill { display: inline-block; padding: 2px 9px; border-radius: 99px; font-size: 12px; font-weight: 600;
  background: var(--brand-soft); color: var(--brand); white-space: nowrap; }
.pill.off { background: var(--danger-soft); color: var(--danger); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.grey { background: var(--bg); color: var(--muted); }
.code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 16px; font-weight: 700; letter-spacing: 1px;
  background: var(--bg); padding: 4px 8px; border-radius: 6px; user-select: all; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin: 6px 0 14px; overflow-x: auto; }
.tabs button { border: 0; border-bottom: 3px solid transparent; border-radius: 0; background: none; padding: 9px 12px;
  color: var(--muted); white-space: nowrap; }
.tabs button.on { color: var(--ink); border-bottom-color: var(--brand); font-weight: 600; }
.crumbs { margin-bottom: 10px; font-size: 14px; }
.crumbs button { padding: 0; }
.msg { padding: 10px 12px; border-radius: 8px; margin: 10px 0; }
.msg.err { background: var(--danger-soft); color: var(--danger); }
.msg.ok { background: var(--brand-soft); color: var(--brand); }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 14px; }
.kpi { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; }
.kpi .v { font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; }
.kpi .l { font-size: 12px; color: var(--muted); }
.bars { display: flex; flex-direction: column; gap: 5px; }
.bar { display: grid; grid-template-columns: 110px 1fr 90px; gap: 8px; align-items: center; font-size: 13px; }
.bar .track { background: var(--bg); border-radius: 4px; height: 14px; overflow: hidden; }
.bar .fill { background: var(--brand); height: 100%; }
.bar .n { text-align: right; font-variant-numeric: tabular-nums; }
table.t { width: 100%; border-collapse: collapse; font-size: 14px; }
table.t th, table.t td { text-align: left; padding: 7px 6px; border-bottom: 1px solid var(--line); }
table.t td.n, table.t th.n { text-align: right; font-variant-numeric: tabular-nums; }
.switch { display: flex; align-items: center; gap: 10px; padding: 8px 0; }
.switch input { width: auto; }
dialog { border: 1px solid var(--line); border-radius: 12px; background: var(--card); color: var(--ink);
  padding: 18px; width: min(460px, calc(100vw - 32px)); }
dialog::backdrop { background: rgba(0,0,0,.35); }
dialog h2 { margin: 0 0 8px; font-size: 17px; }
dialog .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
.hidden { display: none !important; }
.loading { color: var(--muted); padding: 30px; text-align: center; }
/* ---------------------------------------------------------------- telefono */
#navVelo { display: none; }
@media (max-width: 860px) {
  #nav { width: min(300px, 86vw); }
  #navVelo.on { display: block; position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 49; }
}
@media (max-width: 640px) {
  input, select, textarea { font-size: 16px; } /* niente zoom automatico su iPhone */
  header.top { padding: 8px 10px; gap: 8px; }
  header.top .lungo, header.top .who, #assist .t { display: none; }
  main { padding: 10px 8px 60px; }
  .card { padding: 12px; border-radius: 10px; }
  .card h2 { font-size: 16px; }
  .row > button { flex: 1 1 auto; }
  button { padding: 10px 12px; }
  .kpis { grid-template-columns: 1fr 1fr; }
  .bar { grid-template-columns: 80px 1fr 64px; }
  /* finestre a tutto schermo, pulsanti sempre visibili in basso */
  dialog { width: 100vw; max-width: 100vw; height: 100dvh; max-height: 100dvh; margin: 0; border-radius: 0; padding: 14px 14px 0; }
  dialog .actions { position: sticky; bottom: 0; background: var(--card); padding: 10px 0 14px; margin: 16px 0 0; border-top: 1px solid var(--line); }
  dialog .actions button { flex: 1; }
  /* tabelle a schede: una scheda per riga, con il nome della colonna davanti */
  table.t, table.t tbody, table.t tr, table.t td { display: block; width: 100%; }
  table.t thead, table.t tr:has(> th) { display: none; }
  table.t tr { border-bottom: 1px solid var(--line); padding: 8px 2px; }
  table.t td { border: 0; padding: 2px 0; text-align: left !important; }
  table.t td[data-l]::before { content: attr(data-l) ": "; color: var(--muted); font-size: 12px; }
  table.t td:first-child { font-size: 15px; }
  table.t td:first-child::before { display: none; }
  table.t td { white-space: normal !important; }
  table.t td select, table.t td input:not([type=checkbox]):not([type=radio]) { width: 100% !important; margin: 4px 0; }
  table.t td button { margin: 3px 4px 3px 0; }
  /* elenchi con molti pulsanti (casse, licenze): i pulsanti vanno sotto, a capo */
  .list li { flex-wrap: wrap; }
  .list li > .grow { flex-basis: 100%; }
  .list li > button { flex: 1 1 auto; }
}
</style>
</head>
<body>

  <button id="menuBtn" class="hidden" title="Menu">☰</button>
  <span class="logo">Kalù<span class="lungo"> · Backoffice</span></span>
  <span class="spacer"></span>
  <span class="who" id="who"></span>
  <button id="assist" class="hidden" title="Assistenza remota: vedi e usa Kalù del cliente col codice che ti detta">🖥<span class="t"> Assistenza remota</span></button>
  <button id="logout" class="hidden">Esci</button>
</header>
<div id="navVelo"></div><div id="shell"><aside id="nav" class="hidden"></aside><main id="app"><div class="loading">Caricamento…</div></main></div>
<dialog id="dlg"></dialog>
