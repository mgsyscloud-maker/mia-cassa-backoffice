          '<button id="nc">Nuova categoria</button><button class="primary" id="np">Nuovo prodotto</button></div>' +
          '<p class="muted">Le modifiche arrivano su tutte le casse del locale entro un minuto. Ogni prodotto si pubblica sui canali: ' +
          'cassa e palmari lo mostrano se non è spento, kiosk, menu QR e delivery solo se pubblicato.</p>' +
          '<div class="grid2"><div><label>Categoria</label><select id="fc">' + catOpts + '</select></div>' +
          '<div><label>Cerca (nome, codice a barre)</label><input id="fq" value="' + esc(state.q) + '"></div></div>' +
          (state.cat ? '<div class="row" style="margin-top:10px"><button id="ec">Modifica la categoria</button></div>' : '') +
          '</div><div class="card">' + (shown.length ? '<table class="t"><tr><th>Prodotto</th><th>Categoria</th><th class="n">Prezzo</th><th class="n">IVA</th><th>Canali</th></tr>' +
          shown.map(function (p) {
            var on = chans.filter(function (ch) { return isPublished(pubs, p.id, ch, p); });
            return '<tr class="click" data-p="' + p.id + '" style="cursor:pointer"><td><b>' + esc(p.name) + '</b>' + (p.hide_button ? ' <span class="pill grey">senza tasto</span>' : '') + (on.length ? '' : ' <span class="pill off">fuori vendita</span>') + '</td><td class="muted">' + esc(catPath(p.category_id)) + '</td>' +
              '<td class="n">' + eur(p.price_cents) + '</td><td class="n">' + p.vat + '%</td><td>' +
              on.map(function (ch) { return '<span class="pill' + (ch.fixed ? ' grey' : '') + '">' + esc(ch.name) + '</span> '; }).join('') + '</td></tr>';
          }).join('') + '</table>' + (list.length > shown.length ? '<p class="muted">Mostrati 300 di ' + list.length + ': restringi con la ricerca o la categoria.</p>' : '')
          : '<p class="muted">' + (prods.length ? 'Nessun prodotto trovato.' : 'Catalogo vuoto: collega una cassa (manda il suo catalogo) oppure crea i prodotti qui.') + '</p>') + '</div>';
        $('#fc').onchange = function () { state.cat = this.value; render(); };
        var t; $('#fq').oninput = function () { var v = this.value; clearTimeout(t); t = setTimeout(function () { state.q = v; render(); var f = $('#fq'); f.focus(); f.setSelectionRange(v.length, v.length); }, 250); };
        $('#np').onclick = function () { productDialog(null); };
        $('#nc').onclick = function () { categoryDialog(null); };
        if ($('#ec')) $('#ec').onclick = function () { categoryDialog(catById[state.cat]); };
        $all('[data-p]', box).forEach(function (tr) { tr.onclick = function () { productDialog(prods.filter(function (p) { return p.id === tr.getAttribute('data-p'); })[0]); }; });
      }
      function reload() { catalogTab(box, s, state); }

      function productDialog(p) {
        if (!cats.length) { info('Prima una categoria', '<p>Crea almeno una categoria (es. Bevande, Cucina).</p>'); return; }
        p = p || { id: null, name: '', category_id: state.cat || cats[0].id, price_cents: 0, vat: 10, description: '', allergens: '', barcode: '', prep_minutes: null, hide_button: false };
        var chRows = chans.map(function (ch) {
          var pub = pubs[(p.id || '') + '|' + ch.key];
          var vis = p.id ? isPublished(pubs, p.id, ch, p) : defaultOn(ch);
          return '<tr><td><label class="switch" style="margin:0;color:inherit"><input type="checkbox" data-cv="' + esc(ch.key) + '"' + (vis ? ' checked' : '') + '> ' + esc(ch.name) +
            (ch.kind ? ' <span class="muted">· ' + esc(KIND_LABEL[ch.kind] || ch.kind) + '</span>' : '') + '</label></td>' +
            '<td style="width:120px"><input data-cp="' + esc(ch.key) + '" placeholder="uguale" value="' + (pub && pub.price_cents != null ? (pub.price_cents / 100).toFixed(2).replace('.', ',') : '') + '"></td></tr>';
        }).join('');
        dialog(p.id ? p.name : 'Nuovo prodotto',
          '<label>Nome</label><input id="pn" value="' + esc(p.name) + '">' +
          '<div class="grid2"><div><label>Categoria</label><select id="pc">' + cats.map(function (c) { return '<option value="' + c.id + '"' + (c.id === p.category_id ? ' selected' : '') + '>' + esc(catPath(c.id)) + '</option>'; }).join('') + '</select></div>' +
          '<div><label>Prezzo (€)</label><input id="pp" inputmode="decimal" value="' + (p.price_cents / 100).toFixed(2).replace('.', ',') + '"></div>' +
          '<div><label>IVA</label><select id="pv">' + VATS.map(function (v) { return '<option' + (v === p.vat ? ' selected' : '') + '>' + v + '</option>'; }).join('') + '</select></div>' +
          '<div><label>Codice a barre</label><input id="pb" value="' + esc(p.barcode) + '"></div>' +
          '<div><label>Tempo di preparazione (min)</label><input id="pt" type="number" min="0" value="' + (p.prep_minutes == null ? '' : p.prep_minutes) + '"></div></div>' +
          '<label>Descrizione (si vede su kiosk, menu QR e delivery)</label><textarea id="pd">' + esc(p.description) + '</textarea>' +
          '<label>Allergeni</label><input id="pa" value="' + esc(p.allergens) + '" placeholder="es. glutine, latte, frutta a guscio">' +
          '<div class="switch"><input type="checkbox" id="ph"' + (p.hide_button ? ' checked' : '') + '><span>Senza tasto in cassa (si vende col codice a barre o la ricerca)</span></div>' +
          '<h3>Dove si vende</h3><table class="t">' + chRows + '</table>' +
          (chans.length <= 2 ? '<p class="muted">Per kiosk, menu QR e delivery crea i canali nella scheda Canali di vendita.</p>' : '') +
          (p.id ? '<div class="row" style="margin-top:12px"><button class="danger" id="pdel">Togli dalla vendita</button>' +
            '<span class="muted">I prodotti non si eliminano: restano nello storico e nelle statistiche.</span></div>' : ''),
          'Salva', function () {
            var name = val('pn'); if (!name) throw new Error('Scrivi il nome');
            var price = Math.round(parseFloat((val('pp') || '0').replace(',', '.')) * 100);
            if (isNaN(price) || price < 0) throw new Error('Prezzo non valido');
            var id = p.id || uuid();
            var row = { id: id, store_id: s.id, category_id: $('#pc').value, name: name, price_cents: price, vat: parseInt($('#pv').value, 10),
              barcode: val('pb'), prep_minutes: val('pt') === '' ? null : parseInt(val('pt'), 10), description: val('pd'), allergens: val('pa'),
              hide_button: $('#ph').checked, deleted: false };
            var pubRows = [];
            chans.forEach(function (ch) {
              var vis = $('[data-cv="' + ch.key + '"]').checked;
              var pv = $('[data-cp="' + ch.key + '"]').value.trim();
              var pc = pv === '' ? null : Math.round(parseFloat(pv.replace(',', '.')) * 100);
              if (pc != null && isNaN(pc)) throw new Error('Prezzo non valido per ' + ch.name);
              var old = pubs[id + '|' + ch.key];
              var was = p.id ? isPublished(pubs, id, ch, p) : defaultOn(ch);
              if (vis !== was || (old ? old.price_cents : null) !== pc) {
                pubRows.push({ store_id: s.id, item_kind: 'product', item_id: id, channel_key: ch.key, visible: vis, price_cents: pc });
              }
            });
            return upsert('catalog_products', [row]).then(function () { return pubRows.length ? upsert('catalog_publications', pubRows) : null; }).then(reload);
          });
        if ($('#pdel')) $('#pdel').onclick = function () {
          dlg.close();
          confirmDo('Togliere ' + p.name + ' dalla vendita? Sparisce da casse, palmari e canali ma resta nello storico; si rimette in vendita riaccendendo i canali.', 'Togli dalla vendita', function () {
            return upsert('catalog_publications', chans.map(function (ch) {
              var old = pubs[p.id + '|' + ch.key];
              return { store_id: s.id, item_kind: 'product', item_id: p.id, channel_key: ch.key, visible: false, price_cents: old ? old.price_cents : null };
            })).then(reload);
          });
        };
      }

      function categoryDialog(c) {
        var editing = !!c;
        c = c || { id: null, name: '', parent_id: state.cat || null, hidden: false, sort_order: 0 };
        var online = chans.filter(function (ch) { return !ch.fixed; });
        dialog(editing ? c.name : 'Nuova categoria',
          '<label>Nome</label><input id="cn" value="' + esc(c.name) + '">' +
          '<label>Dentro la categoria</label><select id="cpar"><option value="">— nessuna (principale) —</option>' +
          cats.filter(function (x) { return x.id !== c.id; }).map(function (x) { return '<option value="' + x.id + '"' + (x.id === c.parent_id ? ' selected' : '') + '>' + esc(catPath(x.id)) + '</option>'; }).join('') + '</select>' +
          '<label>Ordine (più basso = prima)</label><input id="cs" type="number" value="' + (c.sort_order || 0) + '">' +
          '<div class="switch"><input type="checkbox" id="ch"' + (c.hidden ? ' checked' : '') + '><span>Nascosta in cassa (si vende col codice a barre, es. sigarette)</span></div>' +
          (editing && online.length ? '<h3>Pubblica tutti i prodotti della categoria</h3><div class="row">' + online.map(function (ch) {
            return '<button data-all="' + esc(ch.key) + '">Su ' + esc(ch.name) + '</button><button data-none="' + esc(ch.key) + '" class="danger">Togli da ' + esc(ch.name) + '</button>';
          }).join('') + '</div>' : '') +
          (editing ? '<div class="row" style="margin-top:12px"><button class="danger" id="cdel">Elimina categoria</button></div>' : ''),
          'Salva', function () {
            if (!val('cn')) throw new Error('Scrivi il nome');
            return upsert('catalog_categories', [{ id: c.id || uuid(), store_id: s.id, name: val('cn'), parent_id: $('#cpar').value || null,
              sort_order: parseInt(val('cs') || '0', 10), hidden: $('#ch').checked, deleted: false }]).then(reload);
          });
        function bulk(key, visible) {
          var ids = prods.filter(function (p) { var x = catById[p.category_id]; while (x) { if (x.id === c.id) return true; x = catById[x.parent_id]; } return false; }).map(function (p) { return p.id; });
          if (!ids.length) { $('#dlgMsg').innerHTML = msg('Nessun prodotto in questa categoria'); return; }
          upsert('catalog_publications', ids.map(function (id) { return { store_id: s.id, item_kind: 'product', item_id: id, channel_key: key, visible: visible, price_cents: (pubs[id + '|' + key] || {}).price_cents == null ? null : pubs[id + '|' + key].price_cents }; }))
            .then(function () { dlg.close(); reload(); }).catch(function (e) { $('#dlgMsg').innerHTML = msg(e.message); });
        }
        $all('[data-all]', dlg).forEach(function (b) { b.onclick = function () { bulk(b.getAttribute('data-all'), true); }; });
        $all('[data-none]', dlg).forEach(function (b) { b.onclick = function () { bulk(b.getAttribute('data-none'), false); }; });
        if ($('#cdel')) $('#cdel').onclick = function () {
          var inside = prods.filter(function (p) { var x = catById[p.category_id]; while (x) { if (x.id === c.id) return true; x = catById[x.parent_id]; } return false; }).length;
          if (inside) { $('#dlgMsg').innerHTML = msg('La categoria contiene ' + inside + ' prodotti: non si elimina (resterebbero senza storico). Nascondila in cassa o togli i prodotti dalla vendita.'); return; }
          dlg.close();
          confirmDo('Eliminare la categoria vuota ' + c.name + '?', 'Elimina', function () {
            return upd('catalog_categories', 'id=eq.' + c.id, { deleted: true }).then(function () { state.cat = ''; reload(); });
          });
        };
      }
      render();
    }).catch(function (e) { box.innerHTML = msg(e.message); });
  }

  // ---------------------------------------------------------------- menu di un canale online
  function menuUrl(c, table) {
    var base = location.origin + location.pathname.replace(/[^\/]*$/, '');
    return base + 'menu.html?c=' + encodeURIComponent(c.public_code) + (table ? '&t=' + encodeURIComponent(table) : '');
  }

  // stessa regola del cloud: vale la categoria più vicina impostata per il canale
  function catState(catChans, catById, catId) {
    var c = catById[catId], seen = 0;
    while (c && seen++ < 12) { if (catChans[c.id]) return catChans[c.id]; c = catById[c.parent_id]; }
    return null;
  }
  function onlineVisible(pubs, catChans, catById, p, key) {
    var pub = pubs[p.id + '|' + key], st = catState(catChans, catById, p.category_id);
    if (!st) return pub ? pub.visible : false;
    if (!st.visible) return false;
    if (st.mode === 'some') return pub ? pub.visible : false;
    return pub ? pub.visible : true;
  }

  function channelMenu(box, s, ch) {
    box.innerHTML = '<div class="loading">Caricamento del menu…</div>';
    Promise.all([
      getAll('catalog_categories?select=*&store_id=eq.' + s.id + '&deleted=is.false&order=sort_order,name'),
      getAll('catalog_products?select=id,name,category_id,price_cents&store_id=eq.' + s.id + '&deleted=is.false&order=sort_order,name'),
      getAll('catalog_publications?select=*&store_id=eq.' + s.id + '&item_kind=eq.product&channel_key=eq.' + ch.key),
      getAll('catalog_category_channels?select=*&store_id=eq.' + s.id + '&channel_key=eq.' + ch.key)
    ]).then(function (r) {
      var cats = r[0].filter(function (c) { return !c.tobacco; }), prods = r[1], pubs = {}, catChans = {}, catById = {};
      r[2].forEach(function (x) { pubs[x.item_id + '|' + ch.key] = x; });
      r[3].forEach(function (x) { catChans[x.category_id] = x; });
      cats.forEach(function (c) { catById[c.id] = c; });
      var open = {};
      function render() {
        var shown = prods.filter(function (p) { return catById[p.category_id] && onlineVisible(pubs, catChans, catById, p, ch.key); }).length;
        var rows = [];
        function walk(parent, depth) {
          cats.filter(function (c) { return (c.parent_id || null) === parent; }).forEach(function (c) {
            var own = catChans[c.id], st = catState(catChans, catById, c.id);
            var val = own ? (own.visible ? own.mode : 'off') : (depth ? 'inherit' : 'off');
            var items = prods.filter(function (p) { return p.category_id === c.id; });
            var on = items.filter(function (p) { return onlineVisible(pubs, catChans, catById, p, ch.key); }).length;
            var eff = st ? (st.visible ? (st.mode === 'some' ? 'solo alcuni' : 'tutti') : 'non mostrata') : 'non mostrata';
            rows.push('<div class="card" style="margin:0 0 8px ' + (depth * 22) + 'px;padding:12px 14px"><div class="row">' +
              '<div class="grow"><b>' + esc(c.name) + '</b><div class="muted">' + (items.length ? on + ' di ' + items.length + ' prodotti nel menu' : 'nessun prodotto diretto') +
              (val === 'inherit' ? ' · come la categoria superiore (' + eff + ')' : '') + '</div></div>' +
              '<select data-cm="' + c.id + '" style="width:auto">' +
              (depth ? '<option value="inherit"' + (val === 'inherit' ? ' selected' : '') + '>Come la superiore</option>' : '') +
              '<option value="off"' + (val === 'off' ? ' selected' : '') + '>Non mostrare</option>' +
              '<option value="all"' + (val === 'all' ? ' selected' : '') + '>Tutti i prodotti</option>' +
              '<option value="some"' + (val === 'some' ? ' selected' : '') + '>Solo alcuni</option></select>' +
              (items.length ? '<button data-open="' + c.id + '">' + (open[c.id] ? 'Chiudi' : 'Prodotti') + '</button>' : '') + '</div>' +
              (open[c.id] ? '<div style="margin-top:8px">' + items.map(function (p) {
                var vis = onlineVisible(pubs, catChans, catById, p, ch.key), pub = pubs[p.id + '|' + ch.key];
                return '<label class="switch" style="padding:6px 0"><input type="checkbox" data-pv="' + p.id + '"' + (vis ? ' checked' : '') + '><span class="grow">' + esc(p.name) + '</span>' +
                  '<span class="muted">' + eur(pub && pub.price_cents != null ? pub.price_cents : p.price_cents) + '</span></label>';
              }).join('') + '</div>' : '') + '</div>');
            walk(c.id, depth + 1);
          });
        }
        walk(null, 0);
        box.innerHTML = '<div class="card"><div class="crumbs" style="margin:0 0 6px"><button class="link" id="mback">‹ Canali di vendita</button></div>' +
          '<div class="row"><h2 class="grow" style="margin:0">Menu · ' + esc(ch.name) + '</h2>' +
          '<a href="' + esc(menuUrl(ch, ch.kind === 'qr' ? '1' : '')) + '" target="_blank" rel="noopener"><button>Anteprima</button></a></div>' +
          '<p class="muted">Per ogni categoria scegli se mostrarla e con quali prodotti: <b>Tutti</b> (di serie, puoi spegnere i singoli) oppure <b>Solo alcuni</b> (accendi quelli da proporre). ' +
          'Le sottocategorie seguono la superiore se non le cambi. Ora nel menu: <b>' + shown + '</b> prodotti. I tabacchi non compaiono mai.</p></div>' +
          (rows.length ? rows.join('') : '<div class="card"><p class="muted">Catalogo vuoto.</p></div>');
        $('#mback').onclick = function () { channelsTab(box, s); };
        $all('[data-open]', box).forEach(function (b) { b.onclick = function () { var id = b.getAttribute('data-open'); open[id] = !open[id]; render(); }; });
        $all('[data-cm]', box).forEach(function (sel) {
          sel.onchange = function () {
            var id = sel.getAttribute('data-cm'), v = sel.value;
            var p = v === 'inherit'
              ? del('catalog_category_channels', 'store_id=eq.' + s.id + '&category_id=eq.' + id + '&channel_key=eq.' + ch.key).then(function () { delete catChans[id]; })
              : upsert('catalog_category_channels', [{ store_id: s.id, category_id: id, channel_key: ch.key, visible: v !== 'off', mode: v === 'some' ? 'some' : 'all' }])
                  .then(function () { catChans[id] = { category_id: id, visible: v !== 'off', mode: v === 'some' ? 'some' : 'all' }; if (v === 'some') open[id] = true; });
            p.then(render).catch(function (e) { info('Errore', msg(e.message)); });
          };
        });
        $all('[data-pv]', box).forEach(function (cb) {
          cb.onchange = function () {
            var id = cb.getAttribute('data-pv'), old = pubs[id + '|' + ch.key];
            var row = { store_id: s.id, item_kind: 'product', item_id: id, channel_key: ch.key, visible: cb.checked, price_cents: old ? old.price_cents : null };
            upsert('catalog_publications', [row]).then(function () { pubs[id + '|' + ch.key] = row; render(); }).catch(function (e) { info('Errore', msg(e.message)); });
          };
        });
      }
      render();
    }).catch(function (e) { box.innerHTML = msg(e.message); });
  }

  // QR da stampare per ogni tavolo: aprono il menu col tavolo già scritto
  function qrDialog(ch) {
    dialog('QR dei tavoli · ' + ch.name,
      '<p class="muted">Scrivi i tavoli: numeri singoli, intervalli o nomi, separati da virgola (es. <b>1-20, 30, Terrazza 1</b>). Ogni QR apre il menu con il tavolo già indicato.</p>' +
      '<label>Tavoli</label><input id="qt" value="1-20">', 'Prepara i QR da stampare', function () {
        var list = [];
        val('qt').split(',').forEach(function (part) {
          part = part.trim(); if (!part) return;
          var m = part.match(/^(\d+)\s*-\s*(\d+)$/);
          if (m) { var a = +m[1], b = +m[2]; if (b - a > 200) throw new Error('Intervallo troppo lungo'); for (var i = a; i <= b; i++) list.push(String(i)); }
          else list.push(part.slice(0, 20));
        });
        if (!list.length) throw new Error('Scrivi almeno un tavolo');
        var w = window.open('', '_blank');
        if (!w) throw new Error('Il browser ha bloccato la finestra: consenti i popup per questa pagina');
        var cards = list.map(function (t, i) {
          return '<div class="q"><div id="q' + i + '" data-u="' + esc(menuUrl(ch, t)) + '"></div><b>Tavolo ' + esc(t) + '</b><span>Inquadra per vedere il menu e ordinare</span></div>';
        }).join('');
        w.document.write('<!doctype html><html lang="it"><head><meta charset="utf-8"><title>QR tavoli</title>' +
          '<style>body{font-family:system-ui,sans-serif;margin:16px}.g{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}' +
          '.q{border:1px solid #ccc;border-radius:12px;padding:14px;text-align:center;break-inside:avoid}.q div{display:flex;justify-content:center;margin-bottom:8px}' +
          '.q b{display:block;font-size:20px}.q span{font-size:12px;color:#555}.bar{margin-bottom:12px}@media print{.bar{display:none}}</style></head><body>' +
          '<div class="bar"><button onclick="print()">Stampa</button></div><div class="g">' + cards + '</div>' +
          '<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"><\/script>' +
          '<script>document.querySelectorAll("[data-u]").forEach(function(d){new QRCode(d,{text:d.getAttribute("data-u"),width:160,height:160,correctLevel:QRCode.CorrectLevel.M});});<\/script></body></html>');
        w.document.close();
      });
  }

  // ---------------------------------------------------------------- canali di vendita
  function channelsTab(box, s) {
    get('sales_channels?select=*&store_id=eq.' + s.id + '&order=kind,created_at').then(function (chans) {
      box.innerHTML = '<div class="card"><div class="row"><h2 class="grow" style="margin:0">Canali di vendita</h2><button class="primary" id="nch">Nuovo canale</button></div>' +
        '<p class="muted">Ogni canale ha il suo menu: nel Catalogo scegli quali prodotti pubblicare e a che prezzo. ' +
        'Si possono avere più kiosk (es. ingresso e bar), il menu QR al tavolo, il delivery proprietario e più punti cassa ' +
        '(es. Cassa bar e Chiringuito, ognuno coi suoi prodotti e prezzi; le sue stampanti si scelgono sulla cassa).</p>' +
        (chans.length ? '<ul class="list">' + chans.map(function (c) {
          return '<li><div class="grow"><b>' + esc(c.name) + '</b> <span class="pill grey">' + esc(KIND_LABEL[c.kind] || c.kind) + '</span>' +
            (c.kind === 'pos' ? '<div class="muted">Cassa e palmari scelgono "lavori come ' + esc(c.name) + '"; le stampanti di questo punto si impostano sulla cassa (Impostazioni → Cassa e dispositivi → Punti cassa)</div></div>'
              : '<div class="muted">' + (c.kind === 'delivery' ? 'Pagina delivery: in arrivo' : '<a href="' + esc(menuUrl(c)) + '" target="_blank" rel="noopener">Apri la pagina</a>') + '</div></div>') +
            (c.active ? '<span class="pill">attivo</span>' : '<span class="pill off">spento</span>') +
            (c.kind !== 'pos' ? '<button data-menu="' + c.id + '" class="primary">Menu</button>' : '') +
            (c.kind === 'qr' ? '<button data-qr="' + c.id + '">QR tavoli</button>' : '') +
            '<button data-ech="' + c.id + '">Modifica</button></li>';
        }).join('') + '</ul>' : '<p class="muted">Nessun canale: crea il primo (es. Menu QR al tavolo).</p>') + '</div>';
      $('#nch').onclick = function () { edit(null); };
      function byId(id) { return chans.filter(function (c) { return c.id === id; })[0]; }
      $all('[data-menu]', box).forEach(function (b) { b.onclick = function () { channelMenu(box, s, byId(b.getAttribute('data-menu'))); }; });
      $all('[data-qr]', box).forEach(function (b) { b.onclick = function () { qrDialog(byId(b.getAttribute('data-qr'))); }; });
      $all('[data-ech]', box).forEach(function (b) { b.onclick = function () { edit(chans.filter(function (c) { return c.id === b.getAttribute('data-ech'); })[0]); }; });
      function edit(c) {
        dialog(c ? c.name : 'Nuovo canale',
          (c ? '' : '<label>Tipo</label><select id="chk"><option value="qr">Menu QR al tavolo</option><option value="kiosk">Kiosk self-service</option><option value="delivery">Delivery / asporto</option><option value="pos">Punto cassa (es. Cassa bar, Chiringuito)</option></select>') +
          '<label>Nome</label><input id="chn" value="' + esc(c ? c.name : '') + '" placeholder="es. Kiosk ingresso, Menu tavoli, Consegne">' +
          (c ? '<div class="switch"><input type="checkbox" id="cha"' + (c.active ? ' checked' : '') + '><span>Attivo (spento: il menu del canale non si apre)</span></div>' : '') +
          (c ? '<div class="row" style="margin-top:12px"><button class="danger" id="chdel">Elimina canale</button></div>' : ''),
          'Salva', function () {
            if (!val('chn')) throw new Error('Scrivi il nome');
            if (c) return upd('sales_channels', 'id=eq.' + c.id, { name: val('chn'), active: $('#cha').checked }).then(function () { channelsTab(box, s); });
            var kind = $('#chk').value, n = chans.filter(function (x) { return x.kind === kind; }).length, key;
            if (kind === 'pos') {
              var base = 'p-' + (val('chn').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 24) || 'punto');
              key = base; var k = 2;
              while (chans.some(function (x) { return x.key === key; })) { key = base + '-' + (k++); }
            } else {
              key = n ? kind + '-' + (n + 1) : kind;
              while (chans.some(function (x) { return x.key === key; })) { n++; key = kind + '-' + (n + 1); }
            }
            return ins('sales_channels', { store_id: s.id, kind: kind, key: key, name: val('chn') }).then(function () { channelsTab(box, s); });
          });
        if ($('#chdel')) $('#chdel').onclick = function () {
          dlg.close();
          confirmDo('Eliminare il canale ' + c.name + '? Il suo menu smette di funzionare (i prodotti restano nel catalogo).', 'Elimina', function () {
            return del('sales_channels', 'id=eq.' + c.id).then(function () { channelsTab(box, s); });
          });
        };
      }
    }).catch(function (e) { box.innerHTML = msg(e.message); });
  }

  function conventionsTab(box, s) {
    get('store_settings?select=value&store_id=eq.' + s.id + '&key=eq.conventions').then(function (rows) {
      var list = []; try { list = JSON.parse((rows[0] && rows[0].value) || '[]'); } catch (e) { list = []; }
      function render() {
        box.innerHTML = '<div class="card"><div class="row"><h2 class="grow" style="margin:0">Convenzioni</h2><button class="primary" id="nc">Nuova convenzione</button></div>' +
          '<p class="muted">Sconti concordati con aziende, hotel, associazioni. In cassa compaiono nel tasto Sconto.</p>' +
          (list.length ? '<ul class="list">' + list.map(function (c, i) { return '<li><span class="grow">' + esc(c.n) + '</span><b>−' + esc(c.p) + '%</b><button data-ec="' + i + '">Modifica</button></li>'; }).join('') + '</ul>' : '<p class="muted">Nessuna convenzione.</p>') +
          '</div><div class="card"><h2>Promozioni ed email marketing</h2><p class="muted">In arrivo: happy hour, 3x2, prezzi a tempo, offerte per i clienti fidelity con consenso.</p></div>';
        $('#nc').onclick = function () { edit(-1); };
        $all('[data-ec]', box).forEach(function (b) { b.onclick = function () { edit(parseInt(b.getAttribute('data-ec'), 10)); }; });
      }
      function save() {
        return upsert('store_settings', [{ store_id: s.id, key: 'conventions', value: JSON.stringify(list) }]).then(render);
      }
      function edit(i) {
        var c = i >= 0 ? list[i] : { n: '', p: '' };
        dialog(i >= 0 ? 'Convenzione' : 'Nuova convenzione', '<label>Nome</label><input id="cn" value="' + esc(c.n) + '"><label>Sconto (%)</label><input id="cp" type="number" min="1" max="100" step="0.5" value="' + esc(c.p) + '">' +
          (i >= 0 ? '<div class="row" style="margin-top:12px"><button class="danger" id="cd">Elimina convenzione</button></div>' : ''), 'Salva', function () {
          var p = parseFloat(val('cp').replace(',', '.'));
          if (!val('cn') || !(p > 0 && p <= 100)) throw new Error('Scrivi il nome e uno sconto tra 1 e 100');
          if (i >= 0) list[i] = { n: val('cn'), p: p }; else list.push({ n: val('cn'), p: p });
          return save();
        });
        if ($('#cd')) $('#cd').onclick = function () { list.splice(i, 1); dlg.close(); save(); };
      }
      render();
    }).catch(function (e) { box.innerHTML = msg(e.message); });
  }

  function analyticsTab(box, s) {
    var today = new Date();
    var from0 = new Date(today.getFullYear(), today.getMonth(), 1);
    box.innerHTML = '<div class="card"><div class="row"><div><label style="margin-top:0">Dal</label><input type="date" id="af" value="' + iso(from0) + '"></div>' +
      '<div><label style="margin-top:0">Al</label><input type="date" id="at" value="' + iso(today) + '"></div>' +
      '<div style="align-self:flex-end"><button class="primary" id="ag">Aggiorna</button></div>' +
      '<div style="align-self:flex-end" class="row"><button data-q="0">Oggi</button><button data-q="7">7 giorni</button><button data-q="30">30 giorni</button></div></div></div><div id="ar"></div>';
    function load() {
      $('#ar').innerHTML = '<div class="loading">Caricamento…</div>';
      rpc('sales_summary', { p_store: s.id, p_from: val('af'), p_to: val('at') }).then(function (r) {
        var docs = r.docs || 0, total = r.total || 0, covers = r.covers || 0;
        function bars(items, labelFn, valueFn, fmt) {
          var max = Math.max.apply(null, items.map(valueFn).concat([1]));
          return '<div class="bars">' + items.map(function (it) {
            var v = valueFn(it);
            return '<div class="bar"><span>' + esc(labelFn(it)) + '</span><span class="track"><span class="fill" style="width:' + Math.max(0, v / max * 100).toFixed(1) + '%;display:block"></span></span><span class="n">' + fmt(v) + '</span></div>';
          }).join('') + '</div>';
        }
        $('#ar').innerHTML = '<div class="kpis"><div class="kpi"><div class="v">' + eur(total) + '</div><div class="l">Incasso netto</div></div>' +
          '<div class="kpi"><div class="v">' + docs + '</div><div class="l">Documenti</div></div>' +
          '<div class="kpi"><div class="v">' + eur(docs ? Math.round(total / docs) : 0) + '</div><div class="l">Scontrino medio</div></div>' +
          '<div class="kpi"><div class="v">' + covers + '</div><div class="l">Coperti</div></div></div>' +
          (docs ? '<div class="card"><h2>Incasso per giorno</h2>' + bars(r.days, function (d) { return day(d.day); }, function (d) { return d.total; }, eur) + '</div>' +
            '<div class="card"><h2>Per fascia oraria</h2>' + bars(r.hours, function (x) { return String(x.hour).padStart(2, '0') + ':00'; }, function (x) { return x.total; }, eur) + '</div>' +
            '<div class="card"><h2>Pagamenti</h2><table class="t"><tr><th>Metodo</th><th class="n">Documenti</th><th class="n">Importo</th></tr>' +
            r.methods.map(function (m) { return '<tr><td>' + esc(m.method || '—') + '</td><td class="n">' + m.docs + '</td><td class="n">' + eur(m.total) + '</td></tr>'; }).join('') + '</table></div>' +
            '<div class="card"><h2>Prodotti più venduti</h2><table class="t"><tr><th>Prodotto</th><th class="n">Quantità</th><th class="n">Importo</th></tr>' +
            r.products.map(function (p) { return '<tr><td>' + esc(p.name) + '</td><td class="n">' + Number(p.qty).toLocaleString('it-IT') + '</td><td class="n">' + eur(p.total) + '</td></tr>'; }).join('') + '</table></div>'
            : '<div class="card"><p class="muted">Nessuna vendita nel periodo. Le casse collegate mandano le vendite automaticamente.</p></div>');
      }).catch(function (e) { $('#ar').innerHTML = msg(e.message); });
    }
    $('#ag').onclick = load;
    $all('[data-q]', box).forEach(function (b) { b.onclick = function () {
      var n = parseInt(b.getAttribute('data-q'), 10), d = new Date(); d.setDate(d.getDate() - n);
      $('#af').value = iso(n ? d : new Date()); $('#at').value = iso(new Date()); load();
    }; });
    load();
  }

  function peopleTab(box, s) {
    Promise.all([get('memberships?select=*&store_id=eq.' + s.id), get('invites?select=*&store_id=eq.' + s.id + '&used_at=is.null&order=created_at.desc')])
      .then(function (r) {
        box.innerHTML = '<div class="card"><div class="row"><h2 class="grow" style="margin:0">Responsabili (manager)</h2><button class="primary" id="im">Invita responsabile</button></div>' +
          '<p class="muted">I responsabili vedono impostazioni, convenzioni e analytics di questo locale.</p>' +
          (r[0].length ? '<ul class="list">' + r[0].map(function (m) { return '<li><span class="grow">' + esc(m.email || m.user_id) + '</span><button class="danger" data-rm="' + m.id + '">Togli</button></li>'; }).join('') + '</ul>' : '<p class="muted">Nessun responsabile.</p>') +
          (r[1].length ? '<h3>Inviti non ancora usati</h3><ul class="list">' + r[1].map(function (i) { return '<li><span class="code">' + esc(i.code) + '</span><span class="grow muted">scade il ' + day(i.expires_at) + '</span><button class="danger" data-di="' + esc(i.code) + '">Annulla</button></li>'; }).join('') + '</ul>' : '') +
          '</div><div class="card"><h2>Operatori della cassa</h2><p class="muted">Camerieri, cassieri e le loro autorizzazioni si gestiscono per ora dalla cassa: Impostazioni → Personale e accessi.</p></div>';
        $('#im').onclick = function () {
          rpc('create_invite', { p_role: 'manager', p_store: s.id }).then(function (code) {
            info('Invito per il responsabile', '<p>Dai questo codice al responsabile: crea il suo accesso al backoffice e lo inserisce. Vale 14 giorni, una volta sola.</p><p><span class="code">' + esc(code) + '</span></p>');
            dlg.addEventListener('close', function once() { dlg.removeEventListener('close', once); storeView(s.id, 'persone'); });
          }).catch(function (e) { info('Errore', msg(e.message)); });
        };
        $all('[data-rm]', box).forEach(function (b) { b.onclick = function () { confirmDo('Togliere l\'accesso a questo responsabile?', 'Togli', function () { return del('memberships', 'id=eq.' + b.getAttribute('data-rm')).then(function () { storeView(s.id, 'persone'); }); }); }; });
        $all('[data-di]', box).forEach(function (b) { b.onclick = function () { del('invites', 'code=eq.' + b.getAttribute('data-di')).then(function () { storeView(s.id, 'persone'); }); }; });
      }).catch(function (e) { box.innerHTML = msg(e.message); });
  }

  function logTab(box, s) {
    get('audit_log?select=*&store_id=eq.' + s.id + '&order=at.desc&limit=200').then(function (rows) {
      box.innerHTML = '<div class="card"><h2>Registro</h2>' + (rows.length ? '<table class="t"><tr><th>Quando</th><th>Cosa</th><th>Dettaglio</th></tr>' +
        rows.map(function (r) { return '<tr><td>' + dt(r.at) + '</td><td>' + esc(r.action) + '</td><td>' + esc(r.detail) + '</td></tr>'; }).join('') + '</table>' : '<p class="muted">Vuoto.</p>') + '</div>';
    }).catch(function (e) { box.innerHTML = msg(e.message); });
  }

  // ---------------------------------------------------------------- partenza
  var fromHash = readHash();
  if (fromHash && fromHash.access_token) {
    setSession({ access_token: fromHash.access_token, refresh_token: fromHash.refresh_token, expires_in: parseInt(fromHash.expires_in || '3600', 10) });
    api('GET', '/auth/v1/user').then(function (u) {
      S.user = u; setSession(Object.assign({}, S.session, { user: u }));
      if (fromHash.type === 'recovery') newPasswordView(); else route();
    }).catch(function () { setSession(null); route(); });
  } else {
    try { var saved = JSON.parse(store('mc_session') || 'null'); if (saved && saved.access_token) { S.session = saved; S.user = saved.user; } } catch (e) { /* niente */ }
    if (S.session && S.session.expires_at - Date.now() / 1000 < 60) refresh().then(route, route); else route();
  }
})();
</script>
</body>
