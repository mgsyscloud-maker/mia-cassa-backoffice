<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mia Cassa Backoffice</title>
<script src="config.js"></script>
<style>
:root {
  --bg: #f4f5f7; --card: #ffffff; --ink: #15181d; --muted: #5d6673; --line: #dfe3e8;
  --brand: #1f6f5c; --brand-ink: #ffffff; --brand-soft: #e3f1ec;
  --danger: #b3261e; --danger-soft: #fbe9e7; --ok: #1e7d32; --warn: #a15c00; --warn-soft: #fff3e0;
  --radius: 10px; --shadow: 0 1px 2px rgba(0,0,0,.06), 0 2px 8px rgba(0,0,0,.04);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111418; --card: #1a1e24; --ink: #e9ecf1; --muted: #9aa4b1; --line: #2c333c;
    --brand: #4fb393; --brand-ink: #0c1512; --brand-soft: #1b2e28;
    --danger: #ff8a80; --danger-soft: #3a1d1b; --ok: #81c784; --warn: #ffb74d; --warn-soft: #3a2a14;
    --shadow: none;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
a { color: var(--brand); }
button, input, select, textarea { font: inherit; color: inherit; }
input, select, textarea { width: 100%; padding: 9px 11px; border: 1px solid var(--line); border-radius: 8px;
  background: var(--card); }
textarea { min-height: 70px; resize: vertical; }
label { display: block; font-size: 13px; color: var(--muted); margin: 10px 0 4px; }
button { cursor: pointer; border: 1px solid var(--line); background: var(--card); padding: 8px 14px; border-radius: 8px; }
button.primary { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); font-weight: 600; }
button.danger { color: var(--danger); }
button.link { border: 0; background: none; color: var(--brand); padding: 4px 0; }
button:disabled { opacity: .5; cursor: default; }
header.top { display: flex; align-items: center; gap: 12px; padding: 10px 18px; background: var(--card);
  border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; }
header.top .logo { font-weight: 800; letter-spacing: .2px; }
header.top .spacer { flex: 1; }
header.top .who { color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 40vw; }
main { max-width: 1100px; margin: 0 auto; padding: 18px 16px 60px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow);
  padding: 16px; margin-bottom: 14px; }
.card h2 { margin: 0 0 10px; font-size: 17px; }
.card h3 { margin: 16px 0 8px; font-size: 15px; }
.narrow { max-width: 420px; margin: 40px auto; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; }
@media (max-width: 640px) { .grid2 { grid-template-columns: 1fr; } }
.list { list-style: none; margin: 0; padding: 0; }
.list li { display: flex; gap: 10px; align-items: center; padding: 11px 4px; border-bottom: 1px solid var(--line); }
.list li:last-child { border-bottom: 0; }
.list li.click { cursor: pointer; }
.list li.click:hover { background: var(--brand-soft); }
.grow { flex: 1; min-width: 0; }
.muted { color: var(--muted); font-size: 13px; }
.pill { display: inline-block; padding: 2px 9px; border-radius: 99px; font-size: 12px; font-weight: 600;
  background: var(--brand-soft); color: var(--brand); white-space: nowrap; }
.pill.off { background: var(--danger-soft); color: var(--danger); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.grey { background: var(--bg); color: var(--muted); }
.code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 16px; font-weight: 700; letter-spacing: 1px;
  background: var(--bg); padding: 4px 8px; border-radius: 6px; user-select: all; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin: 6px 0 14px; overflow-x: auto; }
.tabs button { border: 0; border-bottom: 3px solid transparent; border-radius: 0; background: none; padding: 9px 12px;
  color: var(--muted); white-space: nowrap; }
.tabs button.on { color: var(--ink); border-bottom-color: var(--brand); font-weight: 600; }
.crumbs { margin-bottom: 10px; font-size: 14px; }
.crumbs button { padding: 0; }
.msg { padding: 10px 12px; border-radius: 8px; margin: 10px 0; }
.msg.err { background: var(--danger-soft); color: var(--danger); }
.msg.ok { background: var(--brand-soft); color: var(--brand); }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 14px; }
.kpi { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; }
.kpi .v { font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; }
.kpi .l { font-size: 12px; color: var(--muted); }
.bars { display: flex; flex-direction: column; gap: 5px; }
.bar { display: grid; grid-template-columns: 110px 1fr 90px; gap: 8px; align-items: center; font-size: 13px; }
.bar .track { background: var(--bg); border-radius: 4px; height: 14px; overflow: hidden; }
.bar .fill { background: var(--brand); height: 100%; }
.bar .n { text-align: right; font-variant-numeric: tabular-nums; }
table.t { width: 100%; border-collapse: collapse; font-size: 14px; }
table.t th, table.t td { text-align: left; padding: 7px 6px; border-bottom: 1px solid var(--line); }
table.t td.n, table.t th.n { text-align: right; font-variant-numeric: tabular-nums; }
.switch { display: flex; align-items: center; gap: 10px; padding: 8px 0; }
.switch input { width: auto; }
dialog { border: 1px solid var(--line); border-radius: 12px; background: var(--card); color: var(--ink);
  padding: 18px; width: min(460px, calc(100vw - 32px)); }
dialog::backdrop { background: rgba(0,0,0,.35); }
dialog h2 { margin: 0 0 8px; font-size: 17px; }
dialog .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
.hidden { display: none !important; }
.loading { color: var(--muted); padding: 30px; text-align: center; }
</style>
</head>
<body>
<header class="top">
  <span class="logo">Mia Cassa · Backoffice</span>
  <span class="spacer"></span>
  <span class="who" id="who"></span>
  <button id="logout" class="hidden">Esci</button>
</header>
<main id="app"><div class="loading">Caricamento…</div></main>
<dialog id="dlg"></dialog>

<script>
(function () {
  'use strict';
  var CFG = window.MIA_CASSA_CLOUD || {};
  var URL_ = (CFG.url || '').replace(/\/+$/, '');
  var KEY = CFG.key || '';
  var app = document.getElementById('app');
  var S = { session: null, user: null, memberships: [], view: null };

  // ---------------------------------------------------------------- utilità
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function eur(c) { return ((c || 0) / 100).toLocaleString('it-IT', { style: 'currency', currency: 'EUR' }); }
  function dt(s) { if (!s) return '—'; var d = new Date(s); return d.toLocaleDateString('it-IT') + ' ' + d.toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' }); }
  function day(s) { if (!s) return '—'; var p = String(s).slice(0, 10).split('-'); return p[2] + '/' + p[1] + '/' + p[0]; }
  function iso(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
  function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) { return null; } return null; }
  function h(html) { app.innerHTML = html; }
  function $(sel, root) { return (root || document).querySelector(sel); }
  function $all(sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }
  function val(id) { var e = document.getElementById(id); return e ? e.value.trim() : ''; }
  function msg(text, ok) { return '<div class="msg ' + (ok ? 'ok' : 'err') + '">' + esc(text) + '</div>'; }

  // ---------------------------------------------------------------- cloud
  function api(method, path, body, opts) {
    opts = opts || {};
    var headers = { 'apikey': KEY, 'Content-Type': 'application/json' };
    if (opts.auth !== false && S.session) headers['Authorization'] = 'Bearer ' + S.session.access_token;
    if (opts.prefer) headers['Prefer'] = opts.prefer;
    return fetch(URL_ + path, { method: method, headers: headers, body: body == null ? undefined : JSON.stringify(body) })
      .then(function (r) {
        return r.text().then(function (t) {
          var j = null; try { j = t ? JSON.parse(t) : null; } catch (e) { j = t; }
          if (r.status === 401 && opts.auth !== false && !opts.retried && S.session) {
            return refresh().then(function () { opts.retried = true; return api(method, path, body, opts); });
          }
          if (!r.ok) {
            var m = j && (j.message || j.msg || j.error_description || j.error) || ('Errore ' + r.status);
            throw new Error(translate(m));
          }
          return j;
        });
      });
  }
  function translate(m) {
    var map = {
      'Invalid login credentials': 'Email o password sbagliate',
      'Email not confirmed': 'Conferma prima l\'email: ti abbiamo mandato un messaggio',
      'User already registered': 'Questa email è già registrata: accedi',
      'Password should be at least 6 characters.': 'La password deve avere almeno 6 caratteri'
    };
    return map[m] || m;
  }
  // dove tornano i link delle email (conferma e nuova password): questa stessa pagina
  var BACK = encodeURIComponent(location.origin + location.pathname);
  function rpc(fn, args) { return api('POST', '/rest/v1/rpc/' + fn, args || {}); }
  function get(path) { return api('GET', '/rest/v1/' + path); }
  function ins(table, row) { return api('POST', '/rest/v1/' + table, row, { prefer: 'return=representation' }).then(function (r) { return r && r[0]; }); }
  function upd(table, filter, row) { return api('PATCH', '/rest/v1/' + table + '?' + filter, row, { prefer: 'return=representation' }); }
  function del(table, filter) { return api('DELETE', '/rest/v1/' + table + '?' + filter); }
  // tutte le righe (il cloud ne dà al massimo 1000 per volta)
  function getAll(path) {
    var out = [];
    function page(off) {
      return get(path + (path.indexOf('?') < 0 ? '?' : '&') + 'limit=1000&offset=' + off).then(function (rows) {
        out = out.concat(rows || []);
        return rows && rows.length === 1000 ? page(off + 1000) : out;
      });
    }
    return page(0);
  }
  function uuid() {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) {
      var r = Math.random() * 16 | 0; return (c === 'x' ? r : (r & 3 | 8)).toString(16);
    });
  }
  function upsert(table, rows) { return api('POST', '/rest/v1/' + table, rows, { prefer: 'resolution=merge-duplicates,return=minimal' }); }

  function setSession(s) {
    if (s && s.access_token) {
      s.expires_at = s.expires_at || Math.floor(Date.now() / 1000) + (s.expires_in || 3600);
      S.session = s; S.user = s.user || S.user;
      store('mc_session', JSON.stringify({ access_token: s.access_token, refresh_token: s.refresh_token, expires_at: s.expires_at, user: S.user }));
    } else {
      S.session = null; S.user = null; store('mc_session', null);
    }
  }
  function refresh() {
    if (!S.session) return Promise.reject(new Error('Accesso scaduto'));
    return api('POST', '/auth/v1/token?grant_type=refresh_token', { refresh_token: S.session.refresh_token }, { auth: false })
      .then(setSession, function (e) { setSession(null); route(); throw e; });
  }
  setInterval(function () {
    if (S.session && S.session.expires_at - Date.now() / 1000 < 300) refresh().catch(function () {});
  }, 60000);

  // ---------------------------------------------------------------- dialog
  var dlg = document.getElementById('dlg');
  function dialog(title, bodyHtml, okLabel, onOk) {
    dlg.innerHTML = '<h2>' + esc(title) + '</h2><div id="dlgBody">' + bodyHtml + '</div><div id="dlgMsg"></div>' +
      '<div class="actions"><button id="dlgCancel">Annulla</button>' + (okLabel ? '<button class="primary" id="dlgOk">' + esc(okLabel) + '</button>' : '') + '</div>';
    $('#dlgCancel').onclick = function () { dlg.close(); };
    if (okLabel) $('#dlgOk').onclick = function () {
      var b = $('#dlgOk'); b.disabled = true;
      Promise.resolve().then(onOk).then(function (keep) { if (keep !== true) dlg.close(); })
        .catch(function (e) { $('#dlgMsg').innerHTML = msg(e.message); })
        .then(function () { b.disabled = false; });
    };
    dlg.showModal();
    var f = $('input, select, textarea', dlg); if (f) f.focus();
  }
  function info(title, html) { dialog(title, html, null); $('#dlgCancel').textContent = 'Chiudi'; }
  function confirmDo(text, okLabel, fn) { dialog('Conferma', '<p>' + esc(text) + '</p>', okLabel, fn); }

  // ---------------------------------------------------------------- accesso
  function loginView(mode, note) {
    $('#logout').classList.add('hidden'); $('#who').textContent = '';
    var signup = mode === 'signup';
    h('<div class="card narrow"><h2>' + (signup ? 'Crea il tuo accesso' : 'Accedi') + '</h2>' +
      (note ? note : '') +
      '<label>Email</label><input id="em" type="email" autocomplete="username">' +
      '<label>Password</label><input id="pw" type="password" autocomplete="' + (signup ? 'new-password' : 'current-password') + '">' +
      (signup ? '<label>Ripeti la password</label><input id="pw2" type="password" autocomplete="new-password">' : '') +
      '<div id="m"></div><div class="row" style="margin-top:14px"><button class="primary" id="go">' + (signup ? 'Registrati' : 'Accedi') + '</button>' +
      '<span class="spacer"></span></div>' +
      '<p class="muted" style="margin-top:16px">' + (signup
        ? 'Hai già un accesso? <button class="link" id="sw">Accedi</button>'
        : 'Prima volta? <button class="link" id="sw">Crea il tuo accesso</button> · <button class="link" id="fg">Password dimenticata</button>') + '</p></div>');
    $('#sw').onclick = function () { loginView(signup ? 'login' : 'signup'); };
    if ($('#fg')) $('#fg').onclick = function () {
      var em = val('em'); if (!em) { $('#m').innerHTML = msg('Scrivi la tua email'); return; }
      api('POST', '/auth/v1/recover?redirect_to=' + BACK, { email: em }, { auth: false })
        .then(function () { $('#m').innerHTML = msg('Ti abbiamo mandato un\'email per scegliere una nuova password', true); })
        .catch(function (e) { $('#m').innerHTML = msg(e.message); });
    };
    function go() {
      var em = val('em'), pw = $('#pw').value;
      if (!em || !pw) { $('#m').innerHTML = msg('Scrivi email e password'); return; }
      if (signup && pw !== $('#pw2').value) { $('#m').innerHTML = msg('Le due password non coincidono'); return; }
      $('#go').disabled = true;
      var p = signup
        ? api('POST', '/auth/v1/signup?redirect_to=' + BACK, { email: em, password: pw }, { auth: false })
        : api('POST', '/auth/v1/token?grant_type=password', { email: em, password: pw }, { auth: false });
      p.then(function (r) {
        if (r && r.access_token) { setSession(r); route(); return; }
        loginView('login', msg('Controlla la posta: ti abbiamo mandato il link per confermare l\'email, poi accedi.', true));
      }).catch(function (e) { $('#m').innerHTML = msg(e.message); $('#go').disabled = false; });
    }
    $('#go').onclick = go;
    $all('input', app).forEach(function (i) { i.onkeydown = function (e) { if (e.key === 'Enter') go(); }; });
  }

  // link delle email (conferma, recupero password): i dati arrivano dopo il #
  function readHash() {
    if (!location.hash || location.hash.indexOf('access_token=') < 0) return null;
    var p = {}; location.hash.slice(1).split('&').forEach(function (kv) { var i = kv.indexOf('='); p[decodeURIComponent(kv.slice(0, i))] = decodeURIComponent(kv.slice(i + 1)); });
    history.replaceState(null, '', location.pathname + location.search);
    return p;
  }

  function newPasswordView() {
    h('<div class="card narrow"><h2>Scegli una nuova password</h2><label>Nuova password</label><input id="pw" type="password" autocomplete="new-password">' +
      '<div id="m"></div><div class="row" style="margin-top:14px"><button class="primary" id="go">Salva</button></div></div>');
    $('#go').onclick = function () {
      api('PUT', '/auth/v1/user', { password: $('#pw').value })
        .then(function () { route(); })
        .catch(function (e) { $('#m').innerHTML = msg(e.message); });
    };
  }

  // ---------------------------------------------------------------- avvio
  function route() {
    if (!URL_ || !KEY) {
      h('<div class="card narrow"><h2>Cloud non configurato</h2><p>Manca il file config.js con indirizzo e chiave del progetto.</p></div>');
      return;
    }
    if (!S.session) { loginView('login'); return; }
    $('#who').textContent = (S.user && S.user.email) || '';
    $('#logout').classList.remove('hidden');
    h('<div class="loading">Caricamento…</div>');
    Promise.all([get('memberships?select=*&user_id=eq.' + S.user.id), rpc('cloud_ready')])
      .then(function (r) {
        S.memberships = r[0] || [];
        if (!r[1]) return setupResellerView();
        if (!S.memberships.length) return inviteView();
        var admin = S.memberships.filter(function (m) { return m.role === 'reseller_admin'; })[0];
        S.resellerId = admin ? admin.reseller_id : null;
        if (admin) return companiesView(admin.reseller_id);
        return myStoresView();
      })
      .catch(function (e) { h('<div class="card narrow">' + msg(e.message) + '<button id="rt">Riprova</button></div>'); $('#rt').onclick = route; });
  }
  $('#logout').onclick = function () {
    api('POST', '/auth/v1/logout', {}).catch(function () {});
    setSession(null); S.resellerId = null; S.memberships = []; route();
  };

  function setupResellerView() {
    h('<div class="card narrow"><h2>Primo avvio del cloud</h2><p class="muted">Configura il rivenditore che gestisce clienti, locali e licenze. ' +
      'Il tuo accesso diventa amministratore. Si fa una volta sola.</p>' +
      '<label>Nome del rivenditore</label><input id="rn" value="REDIPOS">' +
      '<label>Partita IVA</label><input id="rv">' +
      '<div id="m"></div><div class="row" style="margin-top:14px"><button class="primary" id="go">Configura</button></div></div>');
    $('#go').onclick = function () {
      rpc('bootstrap_reseller', { p_name: val('rn'), p_vat: val('rv') }).then(route).catch(function (e) { $('#m').innerHTML = msg(e.message); });
    };
  }

  function inviteView() {
    h('<div class="card narrow"><h2>Collega il tuo accesso</h2><p class="muted">Inserisci il codice invito che ti ha dato il rivenditore (per il titolare) o il titolare (per i responsabili).</p>' +
      '<label>Codice invito</label><input id="ic" placeholder="XXXX-XXXX-XXXX-XXXX" style="text-transform:uppercase">' +
      '<div id="m"></div><div class="row" style="margin-top:14px"><button class="primary" id="go">Collega</button></div></div>');
    $('#go').onclick = function () {
      rpc('redeem_invite', { p_code: val('ic') }).then(route).catch(function (e) { $('#m').innerHTML = msg(e.message); });
    };
  }

  // ---------------------------------------------------------------- rivenditore: clienti
  function companiesView(resellerId) {
    S.resellerId = resellerId;
    Promise.all([get('companies?select=*,stores(id,name,licenses(status,valid_until),devices(last_seen,revoked))&order=name'), get('resellers?select=*')])
      .then(function (r) {
        var cs = r[0], rs = r[1][0] || {};
        var rows = cs.map(function (c) {
          var stores = c.stores || [];
          var online = 0, devs = 0, warn = 0;
          stores.forEach(function (s) {
            (s.devices || []).forEach(function (d) { if (!d.revoked) { devs++; if (d.last_seen && Date.now() - new Date(d.last_seen) < 90000) online++; } });
            (s.licenses || []).forEach(function (l) { if (l.status !== 'active' || (l.valid_until && new Date(l.valid_until) < new Date(Date.now() + 15 * 864e5))) warn++; });
          });
          return '<li class="click" data-c="' + c.id + '"><div class="grow"><b>' + esc(c.name) + '</b><div class="muted">' +
            esc([c.vat && 'P.IVA ' + c.vat, c.city].filter(Boolean).join(' · ')) + '</div></div>' +
            '<span class="muted">' + stores.length + ' local' + (stores.length === 1 ? 'e' : 'i') + '</span>' +
            (devs ? '<span class="pill ' + (online ? '' : 'grey') + '">' + online + '/' + devs + ' casse online</span>' : '') +
            (warn ? '<span class="pill warn">licenze da rivedere</span>' : '') + '</li>';
        }).join('');
        h('<div class="card"><div class="row"><h2 class="grow" style="margin:0">Clienti di ' + esc(rs.name || '') + '</h2>' +
          '<button class="primary" id="add">Nuovo cliente</button></div>' +
          (cs.length ? '<ul class="list" style="margin-top:8px">' + rows + '</ul>' : '<p class="muted">Nessun cliente: crea il primo.</p>') + '</div>' +
          '<div class="card" id="upd"><h2>Aggiornamenti dell\'app</h2><div class="loading">Controllo…</div></div>');
        releasesCard($('#upd'), resellerId);
        $('#add').onclick = function () { companyDialog(null); };
        $all('[data-c]').forEach(function (li) { li.onclick = function () { companyView(li.getAttribute('data-c')); }; });
      })
      .catch(function (e) { h(msg(e.message)); });
  }

  // ---------------------------------------------------------------- registro errori di una cassa
  function errorsDialog(deviceId, name) {
    get('app_errors?select=at,kind,message,stack,app_version&device_id=eq.' + deviceId + '&order=at.desc&limit=100').then(function (rows) {
      if (!rows.length) { info('Errori · ' + name, '<p class="muted">Nessun errore registrato da questa cassa.</p>'); return; }
      info('Errori · ' + name, '<p class="muted">Ultimi ' + rows.length + ' (errori dell\'app, chiusure non regolari cioè blocchi o app chiusa a forza, rapporti delle prove di carico; [PROVA] = errore avvenuto in modalità prova).</p>' +
        '<ul class="list" style="max-height:60vh;overflow:auto">' + rows.map(function (r) {
          return '<li style="display:block"><div><span class="pill ' + (r.kind === 'errore' ? 'off' : r.kind === 'prova' ? 'warn' : 'grey') + '">' + esc(r.kind === 'prova' ? 'prova di carico' : r.kind) + '</span> <b>' + dt(r.at) + '</b>' +
            (r.app_version ? ' <span class="muted">· versione ' + esc(r.app_version) + '</span>' : '') + '</div>' +
            (r.kind === 'prova' ? '<pre style="margin-top:4px;white-space:pre-wrap;font-size:12px">' + esc(r.message) + '</pre>' : '<div style="margin-top:4px">' + esc(r.message) + '</div>') +
            (r.stack ? '<details><summary class="muted">Dettagli tecnici</summary><pre style="white-space:pre-wrap;font-size:12px">' + esc(r.stack) + '</pre></details>' : '') + '</li>';
        }).join('') + '</ul>');
    }).catch(function (e) {
      info('Errori · ' + name, /app_errors|relation|schema cache/i.test(e.message || '')
        ? '<p class="muted">Il registro errori nel cloud non è ancora attivo (migrazione 0007).</p>' : msg(e.message));
    });
  }

  // ---------------------------------------------------------------- aggiornamenti dell'app (portale)
  // Una sezione per piattaforma: Android (tablet, casse, palmari), Windows, Raspberry Pi (Linux ARM).
  var PIATTAFORME = [
    { key: 'android', file: 'app/latest.json', label: 'Android' },
    { key: 'windows', file: 'app/latest-windows.json', label: 'Windows' },
    { key: 'linux-arm64', file: 'app/latest-raspberry.json', label: 'Raspberry Pi' }
  ];
  function releasesCard(box, resellerId) {
    function latestOf(f) { return fetch(f, { cache: 'no-store' }).then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; }); }
    Promise.all([
      Promise.all(PIATTAFORME.map(function (p) { return latestOf(p.file); })),
      get('app_releases?select=*&reseller_id=eq.' + resellerId + '&order=build.desc&limit=30'),
      getAll('devices?select=app_version,platform,revoked,last_seen&revoked=is.false'),
      get('app_releases?select=platform&limit=1').then(function () { return true; }).catch(function () { return false; })
    ]).then(function (r) {
      var latests = r[0], all = r[1], devs = r[2], multi = r[3];
      var html = '<h2>Aggiornamenti dell\'app</h2>' +
        '<p class="muted">Quando pubblichi una versione, le casse collegate di quella piattaforma mostrano all\'apertura "C\'è un nuovo aggiornamento" e si aggiornano con un tocco (dati, menu e stampanti restano).</p>';
      PIATTAFORME.forEach(function (p, i) {
        var latest = latests[i];
        var rels = all.filter(function (x) { return (x.platform || 'android') === p.key; }).slice(0, 8);
        if (!latest && !rels.length && p.key !== 'android') return; // piattaforma non ancora usata
        var pdevs = devs.filter(function (d) { return p.key === 'android' ? !/windows|linux/i.test(d.platform || '') : (d.platform || '').toLowerCase().indexOf(p.key === 'windows' ? 'windows' : 'linux') >= 0; });
        var pub = rels.filter(function (x) { return x.published; })[0];
        var upToDate = pub ? pdevs.filter(function (d) { return d.app_version === pub.version; }).length : 0;
        var fresh = latest && !rels.some(function (x) { return x.build === latest.build; });
        var blocked = p.key !== 'android' && !multi;
        html += '<h3>' + p.label + '</h3>' +
          (pub ? '<p>Versione pubblicata: <b>' + esc(pub.version) + '</b> · aggiornati: <b>' + upToDate + ' di ' + pdevs.length + '</b></p>' : '<p class="muted">Nessuna versione pubblicata.</p>') +
          (fresh && blocked ? '<p class="muted">Nuova versione ' + esc(latest.version) + ' pronta: per pubblicarla va prima aggiornato il cloud (migrazione 0006).</p>' : '') +
          (fresh && !blocked ? '<div class="card" style="background:var(--brand-soft);border-color:var(--brand)"><div class="row"><div class="grow"><b>Nuova versione pronta: ' + esc(latest.version) + '</b>' +
            '<div class="muted">' + (latest.size_bytes ? Math.round(latest.size_bytes / 1048576) + ' MB · ' : '') + esc(latest.date || '') + '</div></div></div>' +
            '<label>Novità da mostrare alle casse</label><textarea id="rnotes-' + i + '">' + esc(latest.notes || '') + '</textarea>' +
            '<div class="row" style="margin-top:10px"><button class="primary" data-rpub="' + i + '">Pubblica alle casse</button><button data-rsave="' + i + '">Prepara senza pubblicare</button></div></div>'
            : (latest || rels.length ? '' : '<p class="muted">Nessun file di aggiornamento sul portale.</p>')) +
          (rels.length ? '<ul class="list">' + rels.map(function (x) {
            return '<li><div class="grow"><b>' + esc(x.version) + '</b><div class="muted">' + esc((x.notes || '').slice(0, 120)) + '</div></div>' +
              (x.published ? '<span class="pill">pubblicata</span><button data-unpub="' + x.id + '">Ritira</button>' : '<span class="pill grey">non pubblicata</span><button data-pubr="' + x.id + '">Pubblica</button>') + '</li>';
          }).join('') + '</ul>' : '');
      });
      box.innerHTML = html;
      function add(i, published) {
        var latest = latests[i], p = PIATTAFORME[i];
        var row = { reseller_id: resellerId, version: latest.version, build: latest.build, url: new URL(latest.url, location.href).href,
          sha256: latest.sha256, size_bytes: latest.size_bytes || 0, notes: val('rnotes-' + i), published: published, published_at: published ? new Date().toISOString() : null };
        if (multi) row.platform = p.key;
        return ins('app_releases', row).then(function () { releasesCard(box, resellerId); }).catch(function (e) { info('Errore', msg(e.message)); });
      }
      $all('[data-rpub]', box).forEach(function (b) { b.onclick = function () {
        var i = +b.getAttribute('data-rpub');
        confirmDo('Pubblicare la versione ' + latests[i].version + ' (' + PIATTAFORME[i].label + ') a tutte le casse dei tuoi clienti?', 'Pubblica', function () { return add(i, true); });
      }; });
      $all('[data-rsave]', box).forEach(function (b) { b.onclick = function () { add(+b.getAttribute('data-rsave'), false); }; });
      $all('[data-unpub]', box).forEach(function (b) { b.onclick = function () {
        upd('app_releases', 'id=eq.' + b.getAttribute('data-unpub'), { published: false }).then(function () { releasesCard(box, resellerId); });
      }; });
      $all('[data-pubr]', box).forEach(function (b) { b.onclick = function () {
        upd('app_releases', 'id=eq.' + b.getAttribute('data-pubr'), { published: true, published_at: new Date().toISOString() }).then(function () { releasesCard(box, resellerId); });
      }; });
    }).catch(function (e) { box.innerHTML = '<h2>Aggiornamenti dell\'app</h2>' + msg(e.message); });
  }

  function companyFields(c) {
    c = c || {};
    function f(id, label, v) { return '<div><label>' + label + '</label><input id="' + id + '" value="' + esc(v) + '"></div>'; }
    return '<div class="grid2">' + f('cn', 'Ragione sociale', c.name) + f('cv', 'Partita IVA', c.vat) + f('cf', 'Codice fiscale', c.tax_code) +
      f('ce', 'Email', c.email) + f('cp', 'Telefono', c.phone) + f('ca', 'Indirizzo', c.address) + f('cz', 'CAP', c.zip) +
      f('cc', 'Comune', c.city) + f('cr', 'Provincia', c.province) + '</div><label>Note</label><textarea id="cno">' + esc(c.notes) + '</textarea>';
  }
  function companyRow() {
    return { name: val('cn'), vat: val('cv'), tax_code: val('cf'), email: val('ce'), phone: val('cp'), address: val('ca'),
      zip: val('cz'), city: val('cc'), province: val('cr'), notes: val('cno') };
  }
  function companyDialog(c) {
    dialog(c ? 'Dati del cliente' : 'Nuovo cliente', companyFields(c), 'Salva', function () {
      var row = companyRow();
      if (!row.name) throw new Error('Scrivi la ragione sociale');
      if (c) return upd('companies', 'id=eq.' + c.id, row).then(function () { companyView(c.id); });
      row.reseller_id = S.resellerId;
      return ins('companies', row).then(function (n) { companyView(n.id); });
    });
  }

  function companyView(id) {
    var isReseller = !!S.resellerId;
    Promise.all([get('companies?select=*&id=eq.' + id), get('stores?select=*,licenses(*),devices(*)&company_id=eq.' + id + '&order=name'),
      get('memberships?select=*&company_id=eq.' + id), get('invites?select=*&company_id=eq.' + id + '&used_at=is.null&order=created_at.desc')])
      .then(function (r) {
        var c = r[0][0]; if (!c) throw new Error('Cliente non trovato');
        var stores = r[1], owners = r[2], invites = r[3];
        h((isReseller ? '<div class="crumbs"><button class="link" id="back">‹ Clienti</button></div>' : '') +
          '<div class="card"><div class="row"><h2 class="grow" style="margin:0">' + esc(c.name) + '</h2><button id="ed">Modifica dati</button>' +
          (isReseller ? '<button class="danger" id="dc">Elimina</button>' : '') + '</div>' +
          '<div class="muted">' + esc([c.vat && 'P.IVA ' + c.vat, c.address, c.zip, c.city, c.province, c.email, c.phone].filter(Boolean).join(' · ')) + '</div></div>' +
          '<div class="card"><div class="row"><h2 class="grow" style="margin:0">Locali</h2>' + (isReseller ? '<button class="primary" id="as">Nuovo locale</button>' : '') + '</div>' +
          (stores.length ? '<ul class="list">' + stores.map(storeRow).join('') + '</ul>' : '<p class="muted">Nessun locale.</p>') + '</div>' +
          '<div class="card"><div class="row"><h2 class="grow" style="margin:0">Titolari</h2>' + (isReseller ? '<button id="io">Invita titolare</button>' : '') + '</div>' +
          (owners.length ? '<ul class="list">' + owners.map(function (m) { return '<li><span class="grow">' + esc(m.email || m.user_id) + '</span>' + (isReseller ? '<button class="danger" data-rm="' + m.id + '">Togli</button>' : '') + '</li>'; }).join('') + '</ul>' : '<p class="muted">Nessun titolare collegato.</p>') +
          (invites.length ? '<h3>Inviti non ancora usati</h3><ul class="list">' + invites.map(function (i) { return '<li><span class="code">' + esc(i.code) + '</span><span class="grow muted">scade il ' + day(i.expires_at) + '</span><button class="danger" data-di="' + esc(i.code) + '">Annulla</button></li>'; }).join('') + '</ul>' : '') +
          '</div>');
        if ($('#back')) $('#back').onclick = function () { companiesView(S.resellerId); };
        $('#ed').onclick = function () { companyDialog(c); };
        if ($('#dc')) $('#dc').onclick = function () {
          confirmDo('Eliminare il cliente ' + c.name + '? Prima vanno eliminati i suoi locali.', 'Elimina', function () {
            return del('companies', 'id=eq.' + c.id).then(function () { companiesView(S.resellerId); });
          });
        };
        if ($('#as')) $('#as').onclick = function () {
          dialog('Nuovo locale', '<label>Nome del locale</label><input id="sn" placeholder="es. Bagni Marconi"><label>Indirizzo</label><input id="sa"><label>Comune</label><input id="sc">' +
            '<label>Casse comprese nella licenza</label><input id="sm" type="number" min="1" max="50" value="1"><label>Licenza valida fino al (vuoto = senza scadenza)</label><input id="su" type="date">',
            'Crea', function () {
              if (!val('sn')) throw new Error('Scrivi il nome del locale');
              return ins('stores', { company_id: c.id, name: val('sn'), address: val('sa'), city: val('sc') }).then(function (s) {
                return ins('licenses', { store_id: s.id, max_devices: parseInt(val('sm') || '1', 10), valid_until: val('su') || null }).then(function () {
                  // i dati dell'attività del locale partono da quelli del cliente
                  return upsert('store_settings', [
                    { store_id: s.id, key: 'biz_name', value: c.name }, { store_id: s.id, key: 'biz_vat', value: c.vat },
                    { store_id: s.id, key: 'biz_cf', value: c.tax_code }, { store_id: s.id, key: 'biz_address', value: c.address },
                    { store_id: s.id, key: 'biz_zip', value: c.zip }, { store_id: s.id, key: 'biz_city', value: c.city },
                    { store_id: s.id, key: 'biz_prov', value: c.province }]);
                }).then(function () { storeView(s.id); });
              });
            });
        };
        if ($('#io')) $('#io').onclick = function () {
          rpc('create_invite', { p_role: 'owner', p_company: c.id }).then(function (code) {
            info('Invito per il titolare', '<p>Dai questo codice al titolare: crea il suo accesso al backoffice e lo inserisce. Vale 14 giorni, una volta sola.</p><p><span class="code">' + esc(code) + '</span></p>');
            dlg.addEventListener('close', function once() { dlg.removeEventListener('close', once); companyView(c.id); });
          }).catch(function (e) { info('Errore', msg(e.message)); });
        };
        $all('[data-rm]').forEach(function (b) { b.onclick = function () { confirmDo('Togliere l\'accesso a questo titolare?', 'Togli', function () { return del('memberships', 'id=eq.' + b.getAttribute('data-rm')).then(function () { companyView(c.id); }); }); }; });
        $all('[data-di]').forEach(function (b) { b.onclick = function () { del('invites', 'code=eq.' + b.getAttribute('data-di')).then(function () { companyView(c.id); }); }; });
        $all('[data-s]').forEach(function (li) { li.onclick = function () { storeView(li.getAttribute('data-s')); }; });
      })
      .catch(function (e) { h(msg(e.message)); });
  }

  function licensePill(l) {
    if (!l) return '<span class="pill grey">senza licenza</span>';
    if (l.status !== 'active') return '<span class="pill off">sospesa</span>';
    if (l.valid_until) {
      var days = Math.round((new Date(l.valid_until) - new Date(iso(new Date()))) / 864e5);
      if (days < 0) return '<span class="pill off">scaduta</span>';
      if (days <= 15) return '<span class="pill warn">scade tra ' + days + ' gg</span>';
      return '<span class="pill">fino al ' + day(l.valid_until) + '</span>';
    }
    return '<span class="pill">attiva</span>';
  }
  function isOnline(d) { return d.last_seen && !d.revoked && Date.now() - new Date(d.last_seen) < 90000; }
  function storeRow(s) {
    var devs = (s.devices || []).filter(function (d) { return !d.revoked; });
    var on = devs.filter(isOnline).length;
    return '<li class="click" data-s="' + s.id + '"><div class="grow"><b>' + esc(s.name) + '</b><div class="muted">' + esc([s.address, s.city].filter(Boolean).join(', ')) + '</div></div>' +
      licensePill((s.licenses || [])[0]) + (devs.length ? '<span class="pill ' + (on ? '' : 'grey') + '">' + on + '/' + devs.length + ' online</span>' : '<span class="pill grey">nessuna cassa</span>') + '</li>';
  }

  function storeView(id, tab) {
    tab = tab || 'panoramica';
    Promise.all([get('stores?select=*,companies(id,name,reseller_id)&id=eq.' + id), get('licenses?select=*&store_id=eq.' + id + '&order=created_at'),
      get('devices?select=*&store_id=eq.' + id + '&order=activated_at')])
      .then(function (r) {
        var s = r[0][0]; if (!s) throw new Error('Locale non trovato');
        var lic = r[1], devs = r[2];
        var isReseller = !!S.resellerId;
        var canPeople = isReseller || S.memberships.some(function (m) { return m.role === 'owner' && m.company_id === s.company_id; });
        var tabs = [['panoramica', 'Licenza e casse'], ['catalogo', 'Catalogo'], ['canali', 'Canali di vendita'], ['impostazioni', 'Impostazioni'], ['marketing', 'Convenzioni'], ['analytics', 'Analytics']]
          .concat(canPeople ? [['persone', 'Persone']] : []).concat([['registro', 'Registro']]);
        h('<div class="crumbs"><button class="link" id="back">‹ ' + esc(isReseller || canPeople ? (s.companies && s.companies.name) || 'Indietro' : 'I tuoi locali') + '</button></div>' +
          '<div class="card" style="padding-bottom:4px"><div class="row"><h2 class="grow" style="margin:0">' + esc(s.name) + '</h2>' + licensePill(lic[0]) + '</div>' +
          '<div class="tabs">' + tabs.map(function (t) { return '<button data-t="' + t[0] + '" class="' + (t[0] === tab ? 'on' : '') + '">' + t[1] + '</button>'; }).join('') + '</div></div>' +
          '<div id="tab"></div>');
        $('#back').onclick = function () { if (isReseller || canPeople) companyView(s.company_id); else myStoresView(); };
        $all('[data-t]').forEach(function (b) { b.onclick = function () { storeView(id, b.getAttribute('data-t')); }; });
        var box = $('#tab');
        if (tab === 'panoramica') overviewTab(box, s, lic, devs, isReseller);
        else if (tab === 'impostazioni') settingsTab(box, s);

        else if (tab === 'catalogo') catalogTab(box, s);
        else if (tab === 'canali') channelsTab(box, s);
        else if (tab === 'analytics') analyticsTab(box, s);

  function overviewTab(box, s, lic, devs, isReseller) {
    var html = '<div class="card"><div class="row"><h2 class="grow" style="margin:0">Licenze</h2>' + (isReseller ? '<button id="nl">Nuova licenza</button>' : '') + '</div>';
    html += lic.length ? '<ul class="list">' + lic.map(function (l) {
      var used = devs.filter(function (d) { return d.license_id === l.id && !d.revoked; }).length;
      return '<li><div class="grow"><span class="code">' + esc(l.code) + '</span><div class="muted" style="margin-top:4px">Piano ' + esc(l.plan) + ' · ' + used + ' di ' + l.max_devices + ' casse in uso' + (l.notes ? ' · ' + esc(l.notes) : '') + '</div></div>' +
        licensePill(l) + (isReseller ? '<button data-el="' + l.id + '">Modifica</button>' : '') + '</li>';
    }).join('') + '</ul>' : '<p class="muted">Nessuna licenza.</p>';
    html += '<p class="muted">Per collegare una cassa: Impostazioni → Attività e licenza → Attiva la licenza, e scrivi il codice.</p></div>';
    html += '<div class="card"><h2>Casse</h2>' + (devs.length ? '<ul class="list">' + devs.map(function (d) {
      return '<li><div class="grow"><b>' + esc(d.name || 'Cassa') + '</b><div class="muted">Versione ' + esc(d.app_version || '—') + ' · attivata il ' + day(d.activated_at) + ' · ultimo contatto ' + dt(d.last_seen) + '</div></div>' +
        (d.revoked ? '<span class="pill off">disattivata</span>' : isOnline(d) ? '<span class="pill">online</span>' : '<span class="pill grey">offline</span>') +
        '<button data-err="' + d.id + '" data-errn="' + esc(d.name || 'Cassa') + '">Errori</button>' +
        '<button data-rn="' + d.id + '">Rinomina</button>' +
        (d.revoked ? '<button data-ra="' + d.id + '">Riattiva</button>' : '<button class="danger" data-rv="' + d.id + '">Disattiva</button>') +
        '<button class="danger" data-rd="' + d.id + '" title="Libera il posto nella licenza">Rimuovi</button></li>';
    }).join('') + '</ul>' : '<p class="muted">Nessuna cassa collegata.</p>') + '</div>';
    box.innerHTML = html;

    $all('[data-rv]', box).forEach(function (b) { b.onclick = function () { confirmDo('Disattivare questa cassa? Smette di ricevere impostazioni e mostra l\'avviso di licenza.', 'Disattiva', function () { return devUpd(b.getAttribute('data-rv'), { revoked: true }); }); }; });

  function licenseDialog(s, l) {

  function settingsTab(box, s) {

        sec[1].forEach(function (f) {
          var k = f[0], label = f[1], type = f[2] || 'text', v = cur[k] != null ? cur[k] : (type === 'select' ? f[4] : f[3]) || '';
          if (type === 'bool') html += '<div class="switch"><input type="checkbox" data-k="' + k + '" data-type="bool"' + (v === '1' ? ' checked' : '') + '><span>' + esc(label) + '</span></div>';

          else if (type === 'select') html += '<label>' + esc(label) + '</label><select data-k="' + k + '">' + f[3].map(function (o) { return '<option value="' + esc(o[0]) + '"' + (o[0] === v ? ' selected' : '') + '>' + esc(o[1]) + '</option>'; }).join('') + '</select>';

  // ---------------------------------------------------------------- catalogo
  var VATS = [22, 10, 5, 4, 0];
  var KIND_LABEL = { kiosk: 'Kiosk', qr: 'Menu QR al tavolo', delivery: 'Delivery', pos: 'Punto cassa' };
  function fixedChannels() { return [{ key: 'cassa', name: 'Cassa', fixed: true }, { key: 'palmare', name: 'Palmari', fixed: true }]; }
  // in cassa, sui palmari e sui punti cassa un prodotto è visibile se non è spento; sui canali online va pubblicato
  function defaultOn(ch) { return !!ch.fixed || ch.kind === 'pos'; }
  var CC = {}, CATBY = {}; // impostazioni delle categorie per canale (caricate dal catalogo)
  function isPublished(pubs, pid, ch, prod) {
    if (!defaultOn(ch) && prod) return onlineVisible(pubs, CC[ch.key] || {}, CATBY, prod, ch.key);
    var p = pubs[pid + '|' + ch.key];
    if (p) return p.visible;
    return defaultOn(ch);
  }

  function catalogTab(box, s, state) {
    state = state || { cat: '', q: '' };
    box.innerHTML = '<div class="loading">Caricamento del catalogo…</div>';
    Promise.all([
      getAll('catalog_categories?select=*&store_id=eq.' + s.id + '&deleted=is.false&order=sort_order,name'),
      getAll('catalog_products?select=*&store_id=eq.' + s.id + '&deleted=is.false&order=sort_order,name'),
      getAll('catalog_publications?select=*&store_id=eq.' + s.id + '&item_kind=eq.product'),
      get('sales_channels?select=*&store_id=eq.' + s.id + '&order=kind,created_at'),
      getAll('catalog_category_channels?select=*&store_id=eq.' + s.id)
    ]).then(function (r) {
      var cats = r[0], prods = r[1], pubs = {}, chans = fixedChannels().concat(r[3]);
      CC = {}; r[4].forEach(function (x) { (CC[x.channel_key] = CC[x.channel_key] || {})[x.category_id] = x; });
      r[2].forEach(function (x) { pubs[x.item_id + '|' + x.channel_key] = x; });
      var catById = {}; cats.forEach(function (c) { catById[c.id] = c; });
      CATBY = catById;
      function catPath(id) { var c = catById[id], out = []; while (c) { out.unshift(c.name); c = catById[c.parent_id]; } return out.join(' › '); }
      function inCat(p) {
        if (!state.cat) return true;
        var c = catById[p.category_id];
        while (c) { if (c.id === state.cat) return true; c = catById[c.parent_id]; }
        return false;
      }
      function render() {
        var q = state.q.toLowerCase();
        var list = prods.filter(function (p) {
          return inCat(p) && (!q || p.name.toLowerCase().indexOf(q) >= 0 || (p.barcode || '').indexOf(q) >= 0 || (p.code || '').toLowerCase() === q);
        });

        var catOpts = '<option value="">Tutte le categorie (' + prods.length + ')</option>' + cats.map(function (c) {
          return '<option value="' + c.id + '"' + (c.id === state.cat ? ' selected' : '') + '>' + esc(catPath(c.id)) + (c.hidden ? ' (nascosta in cassa)' : '') + '</option>';
        }).join('');
